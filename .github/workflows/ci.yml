name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lua 5.1 compatibility
        run: |
          if grep -rnF --include='*.lua' '\x' LibCompress.lua LibCompressTest Tools; then
            echo "::error::hex escapes do not exist in Lua 5.1, use decimal escapes"
            exit 1
          fi

      - name: Luacheck (library)
        uses: nebularg/actions-luacheck@v1
        continue-on-error: true
        with:
          files: LibCompress.lua
          args: "--no-color -q"

      - name: Luacheck (test driver)
        uses: nebularg/actions-luacheck@v1
        with:
          files: LibCompressTest
          args: "--no-color -q"

  package:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag' && !startsWith(github.ref_name, 'baseline-')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
